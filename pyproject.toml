[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fdx"
dynamic = ["version"]
authors = [{ name = "Lenard Rommel" }]

description = "A Python package for finite difference derivatives in JAX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.11"

dependencies = [
    "jax",
    "equinox",
    "jaxtyping",
]

keywords = ["finite-differences", "numerical-derivatives", "scientific-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lenardrommel/fdx"
Documentation = "https://lenardrommel.github.io/fdx/"
Changelog = "https://github.com/lenardrommel/fdx/releases"
Repository = "https://github.com/lenardrommel/fdx"
Issues = "https://github.com/lenardrommel/fdx/issues"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "hypothesis>=6",
]

dev = [
    "ruff",
    "tox>=4.21",
    "pre-commit>=3.5.0",
]

examples = [
    "matplotlib",
]

docs = [
    # mkdocs 2.0 drops the plugin system these docs rely on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.27",
]

[tool.setuptools.packages.find]
include = ["fdx*"]

[tool.setuptools.package-data]
fdx = ["py.typed"]

[tool.setuptools_scm]
# Writes the resolved version into the package at build time.
version_file = "fdx/_version.py"
version_file_template = "__version__ = \"{version}\"\n"
# Lets a build succeed outside a git checkout (e.g. from an unpacked sdist).
fallback_version = "0.0.0"

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The 'repr' attribute with value .* was provided to the Field\\(\\) function:UserWarning",
    "ignore:The 'frozen' attribute with value .* was provided to the Field\\(\\) function:UserWarning",
]

[tool.tox]
requires = ["tox>=4.21"]
env_list = ["fmt", "lint", "py311", "py312", "py313", "py314", "docs"]

[tool.tox.env_run_base]
wheel_build_env = ".pkg"
extras = ["test"]
commands = [["pytest"]]

[tool.tox.env.docs]
extras = ["docs"]
commands = [["mkdocs", "build", "--strict"]]

[tool.tox.env.doctest]
deps = [
    "sphinx",
    "-r docs/requirements.txt",
]
commands = [["sphinx-build", "-M", "doctest", "docs/source", "docs/build/"]]

[tool.tox.env.fmt]
package = "skip"
deps = ["ruff"]
commands = [["ruff", "format", "--check", { replace = "posargs", default = ["."], extend = true }]]

[tool.tox.env.lint]
package = "skip"
deps = ["ruff"]
commands = [["ruff", "check", "--no-fix", { replace = "posargs", default = ["."], extend = true }]]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["fdx", "tests"]
extend-exclude = ["docs/source/**/*.ipynb"]
respect-gitignore = true

[tool.ruff.lint]
extend-select = [
  "B",   # bugbear
  "I",   # import sorting
  "UP",  # pyupgrade
  "D",   # pydocstyle (docstrings)
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
]
ignore = [
  "D105",   # missing docstring in magic methods
  "D401",   # Imperative mood
  "TRY004", # invalid arguments raise ValueError by convention here, not TypeError
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["fdx"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"examples/**/*.py" = ["D"]
